<div class="para" id="fig-7-2-inclusion-exclusion-3-2-3-1">Three Venn diagrams of sets A, B, and C, shown left to right, illustrating inclusion-exclusion. In each diagram, three overlapping circles form seven regions, and each region is labeled with how many times its elements have been counted so far. In the first diagram, the three sets are added together: the regions belonging to only one set are labeled 1, the three regions shared by exactly two sets are labeled 2, and the center region shared by all three sets is labeled 3. In the second diagram, the three pairwise intersections are subtracted: the single-set and pairwise regions are all labeled 1, and the center region drops to 0. In the third diagram, the triple intersection is added back: all seven regions are labeled 1, so every element of the union is counted exactly once.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#fig-7-2-inclusion-exclusion-3-2-3-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
