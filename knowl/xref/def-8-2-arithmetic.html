<article class="definition definition-like"><h2 class="heading">
<span class="type">Definition</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">8.2.2</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">Arithmetic Sequences.</span>
</h2>
<div class="para logical">
<div class="para">A sequence <span class="process-math">\(a_0, a_1, a_2, \ldots\)</span> is called an <dfn class="terminology">arithmetic sequence</dfn> if there is a constant <span class="process-math">\(d\)</span> such that:</div>
<div class="displaymath process-math">
\begin{equation*}
a_k = a_{k - 1} + d \quad \text{for each integer } k \geq 1.
\end{equation*}
</div>
