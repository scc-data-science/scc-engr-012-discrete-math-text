<div class="para logical">
<div class="para">Let <span class="process-math">\(A\)</span> and <span class="process-math">\(B\)</span> be events. If</div>
<div class="displaymath process-math">
\begin{equation*}
\mathbb{P}(A \mid B) = \mathbb{P}(A)
\end{equation*}
</div>
<div class="para">then we say that <span class="process-math">\(A\)</span> and <span class="process-math">\(B\)</span> are <em class="emphasis">independent events</em>.</div>
