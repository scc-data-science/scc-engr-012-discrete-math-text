<div class="para logical">
<div class="para">Let <span class="process-math">\(X_1, X_2, \ldots, X_n\)</span> be random variables. Their <dfn class="terminology">sample mean</dfn> is:</div>
<div class="displaymath process-math">
\begin{equation*}
\overline{X}_n = \frac{X_1 + X_2 + \cdots + X_n}{n}.
\end{equation*}
