</h2>
<div class="para">If <span class="process-math">\(a\)</span> and <span class="process-math">\(b\)</span> are integers and <span class="process-math">\(m\)</span> is a positive integer, then <em class="emphasis"><span class="process-math">\(a\)</span> is congruent to <span class="process-math">\(b\)</span> modulo <span class="process-math">\(m\)</span></em> if <span class="process-math">\(m \mid a - b\text{.}\)</span> If <span class="process-math">\(a\)</span> is congruent to <span class="process-math">\(b\)</span> modulo <span class="process-math">\(m\text{,}\)</span> we write <span class="process-math">\(a \equiv b \; (\text{mod } m)\text{.}\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#def-congruence-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
