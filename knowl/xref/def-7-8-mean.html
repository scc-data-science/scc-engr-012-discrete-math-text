<div class="para logical">
<div class="para">Let <span class="process-math">\(x_1, x_2, \ldots, x_n\)</span> be a collection of real numbers. The <dfn class="terminology">arithmetic mean</dfn> of these numbers is:</div>
<div class="displaymath process-math">
\begin{equation*}
\bar{x} = \frac{\sum_{k=1}^n x_k}{n}.
\end{equation*}
</div>
